# Port @TLSPORT@ for PtokaX, taking nmdcs:// and dchub:// clients alike.
#
# Needs sslh built with libproxyprotocol, which distro packages leave out.
# sslh-select -V prints HAVE_PROXYPROTOCOL when it is there.

foreground: true;
numeric: true;

# 1 is stderr only. The default of 3 adds syslog, which journald records twice.
verbose-config-error: 1;
verbose-connections: 1;
verbose-connections-error: 1;
verbose-probe-error: 1;
verbose-system-error: 1;
verbose-int-error: 1;

# a dchub:// client sends nothing before $Lock, so it waits for this to pass
timeout: 1;
on-timeout: "timeout";

listen:
(
    { host: "0.0.0.0"; port: "@TLSPORT@"; },
    { host: "::"; port: "@TLSPORT@"; }
);

protocols:
(
    { name: "tls"; host: "@TLSHOST@"; port: "@TLSADDRPORT@"; proxyprotocol: 2; },
    { name: "timeout"; host: "@PROXYHOST@"; port: "@PROXYPORT@"; proxyprotocol: 2; }
);
