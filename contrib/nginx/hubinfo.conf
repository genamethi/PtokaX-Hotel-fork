# Pinger endpoint, the http {} half of the pair. The stream block sends
# http/1.1 here, so this listens on loopback only and never on 80.
#
# PtokaX rewrites the file every 60 seconds while PingerAddresses is set.

server {
	# proxy_protocol because the stream block emits it on both branches
	listen 127.0.0.1:8081 proxy_protocol;

	location = /api/v0/hubinfo.json {
		alias @STATEDIR@/hubinfo.json;
		default_type application/json;
		add_header Cache-Control "max-age=60";
	}
}
