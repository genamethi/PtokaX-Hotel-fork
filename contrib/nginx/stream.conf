# NMDCS for PtokaX. Goes in a stream {} block, which is a sibling of http {},
# not inside it. A distro nginx.conf usually includes conf.d/*.conf from inside
# http {}, so this file needs its own include at the top level:
#
#	stream {
#		include /etc/nginx/stream.d/*.conf;
#	}
#
# Needs nginx built --with-stream --with-stream_ssl_module. Neither is on by
# default.
#
# Matching PtokaX settings:
#
#	TLSEnabled		=	1
#	TLSProxyAddress		=	@PROXYADDR@
#	PingerAddresses		=	nmdcs://@HUBADDR@:@TLSPORT@;dchub://@HUBADDR@:@TCPPORT@

# One port carries both. ping.md puts the pinger endpoint on the hub's own port,
# reached by negotiating http/1.1, so nothing here needs to bind 80 or 443 and
# the unit keeps its empty capability set.
map $ssl_alpn_protocol $ptokax_upstream {
	http/1.1  127.0.0.1:8081;
	default   @PROXYADDR@;
}

limit_conn_zone $binary_remote_addr zone=nmdcs:10m;

server {
	listen @TLSPORT@ ssl;

	ssl_certificate     @CERT@;
	ssl_certificate_key @KEY@;
	ssl_protocols       TLSv1.2 TLSv1.3;

	# nginx picks the first entry the client also offers, so adc would hand
	# ncdc a protocol PtokaX does not speak. DC++ sends no ALPN and lands on
	# the default branch above.
	ssl_alpn nmdc http/1.1;

	limit_conn nmdcs 3;

	proxy_pass $ptokax_upstream;

	# v1 carries no TLS information, so bSecure would stay false for every user
	proxy_protocol v2;

	proxy_timeout 1h;
}
