# NMDCS for PtokaX. Goes in a stream {} block, which is a sibling of http {}, not
# inside it. A distro nginx.conf usually includes conf.d/*.conf from inside http {},
# so this file needs its own include line at the top level of nginx.conf:
#
#	stream {
#		include /etc/nginx/stream.d/*.conf;
#	}
#
# Needs nginx built --with-stream --with-stream_ssl_module. Neither is on by default.
#
# Matching PtokaX settings:
#
#	TLSEnabled		=	1
#	TLSProxyAddress		=	127.0.0.1:5411
#	PingerAddresses		=	nmdcs://@HUBADDR@:@TLSPORT@;dchub://@HUBADDR@:@TCPPORT@

limit_conn_zone $binary_remote_addr zone=nmdcs:10m;

server {
	listen @TLSPORT@ ssl;

	ssl_certificate     @CERT@;
	ssl_certificate_key @KEY@;
	ssl_protocols       TLSv1.2 TLSv1.3;

	# nginx picks the first entry here the client also offers, so adc would hand
	# ncdc a protocol PtokaX does not speak. DC++ sends no ALPN and ignores this.
	ssl_alpn nmdc;

	limit_conn nmdcs 3;

	proxy_pass @PROXYADDR@;

	# v1 carries no TLS information, so bSecure would stay false for every user
	proxy_protocol v2;

	proxy_timeout 1h;
}
