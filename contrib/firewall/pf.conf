# Same limit as nftables.nft, for FreeBSD, OpenBSD and NetBSD.
# See POLICY for where the numbers come from.
#
#	pfctl -f pf.conf
#
# max-src-conn-rate is the direct equivalent of NewConnectionsCount over
# NewConnectionsTime. pf does the bookkeeping, no set to create.

ptokax_ports = "{ 411, 5411 }"

table <ptokax-flooders> persist

block in quick from <ptokax-flooders>

# synproxy state answers the handshake before the hub sees it
pass in proto tcp to port $ptokax_ports \
	synproxy state \
	(max-src-conn-rate 10/60, overload <ptokax-flooders> flush global)

# OpenBSD drops table entries older than this on a cron run:
#	pfctl -t ptokax-flooders -T expire 600
